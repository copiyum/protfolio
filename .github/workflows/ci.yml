name: ci

# Gate every PR (and pushes to main) on lint, tests, and a production build.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch/PR cancels the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify immutable action pins
        run: node scripts/check-action-pins.mjs

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # `next build` also runs the TypeScript type-check (it understands CSS
      # module imports, which a bare `tsc --noEmit` does not).
      - name: Build
        run: npm run build
