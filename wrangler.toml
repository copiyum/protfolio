name = "pf-admin"
main = "worker.ts"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
# Wrangler's esbuild defaults to keepNames, which injects `__name(fn, "fn")`
# calls into function bodies. next-themes serializes its theme script with
# Function.prototype.toString(), so the inline <script> shipped to browsers
# referenced an undefined `__name` and threw before the theme was applied.
keep_names = false

[observability]

[observability.logs]
enabled = true
invocation_logs = true

[triggers]
crons = ["0 3 * * *"]  # daily 03:00 UTC: audit snapshot to R2

[[routes]]
pattern = "sarang.dev/*"
zone_name = "sarang.dev"

[[d1_databases]]
binding = "DB"
database_name = "pf-admin"
database_id = "1a95c7c1-e993-41d9-8ee4-e7bbf61e74ef"

[[r2_buckets]]
binding = "R2"
bucket_name = "pf-admin-assets"

# OpenNext ISR cache (open-next.config.ts). Create once before deploying:
#   npx wrangler r2 bucket create pf-next-inc-cache
[[r2_buckets]]
binding = "NEXT_INC_CACHE_R2_BUCKET"
bucket_name = "pf-next-inc-cache"

# OpenNext revalidation queue + tag cache. Classes are re-exported from
# worker.ts; Wrangler creates the namespaces on deploy (no manual setup).
[[durable_objects.bindings]]
name = "NEXT_CACHE_DO_QUEUE"
class_name = "DOQueueHandler"

[[durable_objects.bindings]]
name = "NEXT_TAG_CACHE_DO_SHARDED"
class_name = "DOShardedTagCache"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DOQueueHandler", "DOShardedTagCache"]

[images]
binding = "IMAGES"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "pf-admin"

[vars]
NODE_ENV = "production"
NEXT_PUBLIC_TURNSTILE_SITEKEY = "0x4AAAAAADuge60msITfVisd"

# Secrets via `wrangler secret put`:
# ADMIN_COOKIE_SECRET
# CF_ACCESS_AUD
CF_ACCESS_TEAM_DOMAIN="floral-tree-4100.cloudflareaccess.com"
# TURNSTILE_SECRET
# RATE_LIMIT_SECRET
# ALERT_EMAIL_WEBHOOK
